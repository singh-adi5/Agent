name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default for every job. Only the deploy job adds a permission.
permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main are queued instead, so a new
# push never cancels a deployment part-way through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, unit tests, KQL parse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: make install
      - run: make check

  emulator:
    name: queries on Kusto engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:3e3ad07290728f8e47cc1cba78a726c64f4a9980e11a20502a45c0a242d6f8b3
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: make emulator-test

  deploy:
    name: deploy to Sentinel
    needs: [check, emulator]
    # Off until the repository variable SENTINEL_DEPLOY is set to true. It must be a
    # repository variable: environment variables are not available when a job's `if` is
    # evaluated. Restricting the sentinel environment to the main branch enforces the
    # branch rule outside this file as well (docs/deployment.md).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SENTINEL_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sentinel
    concurrency:
      group: deploy-sentinel
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived Azure token; no stored credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check deployment settings
        # Environment variables are read here, inside a step, where they are available.
        env:
          RESOURCE_GROUP: ${{ vars.SENTINEL_RESOURCE_GROUP }}
          WORKSPACE: ${{ vars.SENTINEL_WORKSPACE }}
          ENABLE_RULES: ${{ vars.SENTINEL_ENABLE_RULES }}
        run: |
          [[ "$RESOURCE_GROUP" =~ ^[-A-Za-z0-9_.()]{1,90}$ ]] || { echo "::error::SENTINEL_RESOURCE_GROUP is missing or invalid"; exit 1; }
          [[ "$WORKSPACE" =~ ^[-A-Za-z0-9]{4,63}$ ]] || { echo "::error::SENTINEL_WORKSPACE is missing or invalid"; exit 1; }
          # Anything other than an explicit true or false stops the job, so an unset or
          # mistyped value cannot redeploy every rule disabled.
          [[ "$ENABLE_RULES" == "true" || "$ENABLE_RULES" == "false" ]] || { echo "::error::SENTINEL_ENABLE_RULES must be exactly true or false"; exit 1; }
          {
            echo "RESOURCE_GROUP=$RESOURCE_GROUP"
            echo "WORKSPACE=$WORKSPACE"
            echo "ENABLE_RULES=$ENABLE_RULES"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: make arm
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Recorded in the job log before the change is applied. It is not an approval
      # gate: environment approval happens before the job starts.
      - name: Preview changes
        run: >
          az deployment group what-if
          --resource-group "$RESOURCE_GROUP"
          --template-file build/sentinel-analytics.json
          --parameters workspace="$WORKSPACE" enableRules="$ENABLE_RULES"
      - name: Deploy
        run: >
          az deployment group create
          --resource-group "$RESOURCE_GROUP"
          --name "sentinel-detections-$GITHUB_RUN_NUMBER"
          --template-file build/sentinel-analytics.json
          --parameters workspace="$WORKSPACE" enableRules="$ENABLE_RULES"
