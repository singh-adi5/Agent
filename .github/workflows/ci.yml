name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default for every job. Only the deploy job adds a permission.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, unit tests, KQL parse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: make install
      - run: make check

  emulator:
    name: queries on Kusto engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:3e3ad07290728f8e47cc1cba78a726c64f4a9980e11a20502a45c0a242d6f8b3
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: make emulator-test

  deploy:
    name: deploy to Sentinel
    needs: [check, emulator]
    # Runs on main only, and is skipped until the Azure variables in
    # docs/deployment.md are set on the repository or the sentinel environment.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Add required reviewers to this environment to put a manual approval in front of production.
    environment: sentinel
    concurrency:
      group: deploy-sentinel
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived Azure token; no stored credential
    env:
      RESOURCE_GROUP: ${{ vars.SENTINEL_RESOURCE_GROUP }}
      WORKSPACE: ${{ vars.SENTINEL_WORKSPACE }}
      ENABLE_RULES: ${{ vars.SENTINEL_ENABLE_RULES == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: make arm
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview changes
        run: >
          az deployment group what-if
          --resource-group "$RESOURCE_GROUP"
          --template-file build/sentinel-analytics.json
          --parameters workspace="$WORKSPACE" enableRules="$ENABLE_RULES"
      - name: Deploy
        run: >
          az deployment group create
          --resource-group "$RESOURCE_GROUP"
          --name "sentinel-detections-$GITHUB_RUN_NUMBER"
          --template-file build/sentinel-analytics.json
          --parameters workspace="$WORKSPACE" enableRules="$ENABLE_RULES"
