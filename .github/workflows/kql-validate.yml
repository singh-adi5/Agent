name: kql-validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: kql-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA, not a movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Validate rule.yaml structure, ATT&CK ids and query parity
        run: python scripts/validate_rules.py

      - name: Test the validator and the ARM converter
        run: python -m unittest discover -s tests -v

      - name: Check the DCR sample is valid JSON
        run: python -m json.tool deployment/dcr-securityevent.json > /dev/null

      - name: Install the pinned KQL parser from the lockfile
        run: npm ci --ignore-scripts

      - name: Parse and analyse every query.kql
        run: npm run --silent kql-check

  logic:
    # Runs each detection's real query against sample events on a Kusto engine.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:3e3ad07290728f8e47cc1cba78a726c64f4a9980e11a20502a45c0a242d6f8b3
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Wait for the Kusto engine
        run: |
          for i in $(seq 1 40); do
            if curl -sS -m 3 localhost:8080/v1/rest/query \
                 -H 'Content-Type: application/json' \
                 -d '{"db":"NetDefaultDB","csl":"print 1"}' >/dev/null 2>&1; then
              echo "engine ready"; exit 0
            fi
            sleep 3
          done
          echo "engine did not come up"; exit 1

      - name: Run the detection logic tests
        run: python tests/run_logic_tests.py
