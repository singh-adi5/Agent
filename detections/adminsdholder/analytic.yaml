id: 6a1c0dd4-9886-49fc-9d6e-0b9555b03dcd
name: AdminSDHolder - permissions on the AdminSDHolder object changed
description: |
  Detects a new security descriptor written to the AdminSDHolder object (5136, attribute
  nTSecurityDescriptor, value added). SDProp copies the AdminSDHolder permissions to every
  protected account and group about once an hour, so an entry added here grants lasting control
  over Domain Admins and other privileged principals and survives removal from those objects.
  Requires auditing of writes on the AdminSDHolder object.
severity: High
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 15m
queryPeriod: 20m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1098
query: |
  // Exclusions live in the ADDetectionExclusions watchlist. A row stops applying after its ExpiresOn date.
  let excluded_actors = _GetWatchlist("ADDetectionExclusions")
      | where column_ifexists("Detection", "") == "adminsdholder"
      | where isempty(column_ifexists("ExpiresOn", "")) or todatetime(column_ifexists("ExpiresOn", "")) > now()
      | project Value = tolower(SearchKey);
  SecurityEvent
  | where EventID == 5136
  // Only OperationType is a typed column in SecurityEvent. The rest is read from the raw event XML.
  | extend
      ObjectDN = extract(@'"ObjectDN">([^<]*)<', 1, EventData),
      AttributeName = extract(@'"AttributeLDAPDisplayName">([^<]*)<', 1, EventData),
      AttributeValue = extract(@'"AttributeValue">([^<]*)<', 1, EventData),
      Operation = iff(isnotempty(OperationType), OperationType, extract(@'"OperationType">([^<]*)<', 1, EventData)),
      RawActor = iff(isnotempty(SubjectUserName), SubjectUserName, extract(@'"SubjectUserName">([^<]*)<', 1, EventData))
  | where ObjectDN startswith "CN=AdminSDHolder,CN=System,"
  | where AttributeName =~ "nTSecurityDescriptor"
  // A descriptor change logs two 5136 events: %%14675 (value deleted) holds the old descriptor
  // and %%14674 (value added) the new one. Only the new one is kept.
  | where Operation in~ ("%%14674", "Value Added")
  | extend Actor = tolower(RawActor)
  | where Actor !in (excluded_actors)
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      Changes = count(),
      NewDescriptors = make_set(AttributeValue, 10),
      Computer = take_any(Computer)
      by Actor, ActorDomain = SubjectDomainName, ObjectDN
  | project StartTime, EndTime, Computer, Actor, ActorDomain, ObjectDN, Changes, NewDescriptors
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Actor
      - identifier: NTDomain
        columnName: ActorDomain
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
customDetails:
  Changes: Changes
alertDetailsOverride:
  alertDisplayNameFormat: "AdminSDHolder permissions changed by {{Actor}}"
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
