id: dc516734-e4a0-49a2-905f-ef0e1ea4f840
name: Domain controller SPN changes on all computer accounts
description: |
  Lists every addition or removal of a Global Catalog (GC/) or directory replication (DRSUAPI)
  SPN on any computer account, domain controllers included, and flags whether the account is in
  the ADDomainControllers watchlist. Use it to confirm the watchlist is complete before enabling
  the analytic rule, and to review DC promotions. Run over 30 days. Accounts not in the watchlist
  are the priority.
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1207
query: |
  let domain_controllers = _GetWatchlist("ADDomainControllers")
      | project Account = tolower(SearchKey), Dn = tolower(column_ifexists("DistinguishedName", ""));
  let dc_accounts = toscalar(domain_controllers | summarize make_set(Account));
  let dc_dns = toscalar(domain_controllers | where isnotempty(Dn) | summarize make_set(Dn));
  SecurityEvent
  | where EventID in (4742, 5136)
  | extend
      ChangedSpns = extract(@'"ServicePrincipalNames">([^<]*)<', 1, EventData),
      AttributeName = extract(@'"AttributeLDAPDisplayName">([^<]*)<', 1, EventData),
      AttributeValue = extract(@'"AttributeValue">([^<]*)<', 1, EventData),
      ObjectDN = extract(@'"ObjectDN">([^<]*)<', 1, EventData),
      RawTarget = iff(isnotempty(TargetUserName), TargetUserName, extract(@'"TargetUserName">([^<]*)<', 1, EventData)),
      RawActor = iff(isnotempty(SubjectUserName), SubjectUserName, extract(@'"SubjectUserName">([^<]*)<', 1, EventData))
  | extend Spn = iff(EventID == 4742, ChangedSpns, iff(AttributeName =~ "servicePrincipalName", AttributeValue, ""))
  | where Spn contains "GC/" or Spn contains "E3514235-4B06-11D1-AB04-00C04FC2DCD2/"
  | extend TargetAccount = tolower(iff(EventID == 4742, RawTarget, strcat(extract(@"^CN=([^,]+)", 1, ObjectDN), "$")))
  | extend IsKnownDc = iff(EventID == 4742,
      TargetAccount in (dc_accounts),
      replace_string(tolower(ObjectDN), ",", ";") in (dc_dns))
  | summarize
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated),
      Changes = count(),
      Actors = make_set(tolower(RawActor), 20),
      Spns = make_set(Spn, 50)
      by TargetAccount, IsKnownDc
  | project FirstSeen, LastSeen, TargetAccount, IsKnownDc, Changes, Actors, Spns
  | order by IsKnownDc asc, LastSeen desc
version: 1.0.0
