id: 74208ca8-4182-40fc-aa22-19b012d3342c
name: DCSync - directory replication by a non-domain-controller account
description: |
  Detects use of the directory replication extended rights (DS-Replication-Get-Changes,
  Get-Changes-All, Get-Changes-In-Filtered-Set) by an account that is not a listed domain
  controller or approved replication account (4662). This is the access pattern of Mimikatz
  lsadump::dcsync and Impacket secretsdump. The source address is taken from the matching network
  logon (4624) where one is available.
severity: High
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 15m
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003.006
query: |
  // queryFrequency (15m) plus the 5 minute delay Sentinel applies to every scheduled run.
  // Without the extra 5 minutes each run would skip a slice of events.
  // The longer queryPeriod only feeds the 4624 lookup.
  let detection_window = 20m;
  // Computer account of every domain controller, from the ADDomainControllers watchlist.
  let domain_controllers = _GetWatchlist("ADDomainControllers") | project Account = tolower(SearchKey);
  // Exclusions live in the ADDetectionExclusions watchlist. A row stops applying after its ExpiresOn date.
  let approved_replication_accounts = _GetWatchlist("ADDetectionExclusions")
      | where column_ifexists("Detection", "") == "dcsync"
      | where isempty(column_ifexists("ExpiresOn", "")) or todatetime(column_ifexists("ExpiresOn", "")) > now()
      | project Value = tolower(SearchKey);
  let get_changes = "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2";
  let get_changes_all = "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2";
  let get_changes_filtered = "89e95b76-444d-4c62-991a-0facbeda640c";
  // A logon ID is unique on a DC until it restarts. If one does repeat inside the query period,
  // arg_max keeps the most recent logon, so the result is deterministic.
  let network_logons = SecurityEvent
      | where EventID == 4624 and LogonType == 3
      | summarize arg_max(TimeGenerated, IpAddress) by Computer, TargetLogonId
      | project Computer, TargetLogonId, SourceIp = replace_string(IpAddress, "::ffff:", "");
  SecurityEvent
  | where TimeGenerated > ago(detection_window)
  | where EventID == 4662 and ObjectServer == "DS"
  | where Properties has get_changes or Properties has get_changes_all or Properties has get_changes_filtered
  | extend Actor = tolower(SubjectUserName)
  | where Actor !in (domain_controllers)
  | where Actor !in (approved_replication_accounts)
  | extend ReplicationRight = case(
      Properties has get_changes_all, "DS-Replication-Get-Changes-All",
      Properties has get_changes_filtered, "DS-Replication-Get-Changes-In-Filtered-Set",
      "DS-Replication-Get-Changes")
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      Operations = count(),
      ReplicationRights = make_set(ReplicationRight)
      by Computer, Actor, ActorDomain = SubjectDomainName, SubjectLogonId
  | join kind=leftouter network_logons on Computer, $left.SubjectLogonId == $right.TargetLogonId
  | project StartTime, EndTime, Computer, Actor, ActorDomain, SourceIp, Operations, ReplicationRights, SubjectLogonId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Actor
      - identifier: NTDomain
        columnName: ActorDomain
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIp
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
customDetails:
  Operations: Operations
alertDetailsOverride:
  alertDisplayNameFormat: "Directory replication by non-DC account {{Actor}}"
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
