id: 942759af-7a79-4237-9294-c6d7f4ae8c8c
name: Golden Ticket - service ticket use with no TGT on record
description: |
  Detects Kerberos service ticket requests (4769) for a user account from a source address that
  has no TGT issued (4768) or renewed (4770) for that account in the previous 12 hours. A forged
  TGT is never issued by the KDC, so its use appears as service tickets with no preceding AS
  exchange. Requires 4768, 4769 and 4770 from every domain controller.
severity: Medium
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 12h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1558.001
query: |
  // Longer than the default 10 hour TGT lifetime. Raise it if the domain policy is longer.
  let tgt_lookback = 12h;
  // queryFrequency (1h) plus the 5 minute delay Sentinel applies to every scheduled run.
  // Without the extra 5 minutes each run would skip a slice of events.
  let detection_window = 65m;
  // Lower-case sAMAccountNames with a known reason to roam between addresses.
  let excluded_accounts = dynamic([]);
  let kerberos_events = SecurityEvent
      | where TimeGenerated > ago(tgt_lookback)
      | where EventID in (4768, 4769, 4770)
      // Kerberos fields are read from the typed column when it is populated and from the raw event XML when it is not.
      | extend
          KrbStatus = iff(isnotempty(Status), Status, extract(@'"Status">([^<]*)<', 1, EventData)),
          Service = iff(isnotempty(ServiceName), ServiceName, extract(@'"ServiceName">([^<]*)<', 1, EventData)),
          RawUser = iff(isnotempty(TargetUserName), TargetUserName, extract(@'"TargetUserName">([^<]*)<', 1, EventData)),
          RawIp = iff(isnotempty(IpAddress), IpAddress, extract(@'"IpAddress">([^<]*)<', 1, EventData))
      | extend
          AccountName = tolower(tostring(split(RawUser, "@")[0])),
          SourceIp = replace_string(RawIp, "::ffff:", "")
      // Machine accounts renew constantly and are out of scope for this rule.
      | where isnotempty(AccountName) and AccountName !endswith "$";
  let tgt_on_record = kerberos_events
      | where EventID == 4770 or (EventID == 4768 and KrbStatus =~ "0x0")
      | distinct AccountName, SourceIp;
  kerberos_events
  | where EventID == 4769 and TimeGenerated > ago(detection_window)
  | where KrbStatus =~ "0x0"
  | where Service !~ "krbtgt"
  | where isnotempty(SourceIp) and SourceIp !in ("::1", "127.0.0.1")
  | where AccountName !in (excluded_accounts)
  | join kind=leftanti tgt_on_record on AccountName, SourceIp
  | summarize
      StartTime = min(TimeGenerated),
      EndTime = max(TimeGenerated),
      TicketRequests = count(),
      Services = make_set(Service, 50),
      DomainControllers = make_set(Computer, 20),
      Computer = take_any(Computer)
      // Grouped across domain controllers, so one forged ticket used against several DCs is one alert.
      by AccountName, SourceIp
  | project StartTime, EndTime, Computer, DomainControllers, AccountName, SourceIp, TicketRequests, Services
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIp
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
customDetails:
  TicketRequests: TicketRequests
alertDetailsOverride:
  alertDisplayNameFormat: "Service tickets for {{AccountName}} from {{SourceIp}} with no TGT on record"
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
