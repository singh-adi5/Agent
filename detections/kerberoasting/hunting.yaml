id: bb7ec96e-bb13-4b5a-8624-e25c46b9639d
name: RC4 service ticket requests by account
description: |
  Lists every account that received RC4 service tickets for user-backed SPNs, with no threshold,
  ranked by distinct SPNs. Finds slow Kerberoasting below the analytic rule's threshold and the
  RC4-only services behind its false positives. Run over 7 to 30 days. Accounts with many SPNs and
  few active days are the priority.
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - CredentialAccess
relevantTechniques:
  - T1558.003
query: |
  SecurityEvent
  | where EventID == 4769
  // SecurityEvent has no column for the ticket encryption type, so it is read from the raw event XML.
  | extend
      EncType = extract(@'"TicketEncryptionType">([^<]*)<', 1, EventData),
      KrbStatus = iff(isnotempty(Status), Status, extract(@'"Status">([^<]*)<', 1, EventData)),
      Service = iff(isnotempty(ServiceName), ServiceName, extract(@'"ServiceName">([^<]*)<', 1, EventData)),
      RawUser = iff(isnotempty(TargetUserName), TargetUserName, extract(@'"TargetUserName">([^<]*)<', 1, EventData)),
      RawIp = iff(isnotempty(IpAddress), IpAddress, extract(@'"IpAddress">([^<]*)<', 1, EventData))
  | where KrbStatus =~ "0x0" and EncType in~ ("0x17", "0x18")
  | where Service !endswith "$" and Service !~ "krbtgt"
  | extend
      Requester = tolower(tostring(split(RawUser, "@")[0])),
      SourceIp = replace_string(RawIp, "::ffff:", "")
  | where Requester !endswith "$"
  | summarize
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated),
      SpnCount = dcount(Service),
      TicketRequests = count(),
      ActiveDays = dcount(bin(TimeGenerated, 1d)),
      Services = make_set(Service, 100)
      by Requester, SourceIp
  | project FirstSeen, LastSeen, Requester, SourceIp, SpnCount, TicketRequests, ActiveDays, Services
  | order by SpnCount desc, TicketRequests desc
version: 1.0.0
