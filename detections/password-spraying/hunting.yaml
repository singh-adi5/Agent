id: 671c78be-759d-42f6-95b7-4860e7bed93f
name: Authentication failure sources and subsequent successful logons
description: |
  Ranks source addresses by the number of accounts they failed to authenticate against, from a
  floor of three, and lists accounts that also authenticated successfully from the same address.
  Finds slow sprays below the analytic rule's threshold and sprays that succeeded. Run over 1 to 7
  days. Any source with entries in SucceededAfterFailing is the priority.
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let min_accounts = 3;
  let kerberos_failures = SecurityEvent
      | where EventID == 4771
      | extend
          KrbStatus = iff(isnotempty(Status), Status, extract(@'"Status">([^<]*)<', 1, EventData)),
          RawUser = iff(isnotempty(TargetUserName), TargetUserName, extract(@'"TargetUserName">([^<]*)<', 1, EventData)),
          RawIp = iff(isnotempty(IpAddress), IpAddress, extract(@'"IpAddress">([^<]*)<', 1, EventData))
      | where KrbStatus =~ "0x18"
      | project TimeGenerated, RawUser, RawIp;
  let logon_failures = SecurityEvent
      | where EventID == 4625
      | where SubStatus in~ ("0xc000006a", "0xc0000064")
      | project TimeGenerated, RawUser = TargetUserName, RawIp = IpAddress;
  let successes = SecurityEvent
      | where EventID in (4624, 4768)
      | extend KrbStatus = iff(isnotempty(Status), Status, extract(@'"Status">([^<]*)<', 1, EventData))
      | where EventID == 4624 or KrbStatus =~ "0x0"
      | extend
          AccountName = tolower(tostring(split(TargetUserName, "@")[0])),
          SourceIp = replace_string(IpAddress, "::ffff:", "")
      | where isnotempty(AccountName) and AccountName !endswith "$"
      | summarize SuccessfulAccounts = make_set(AccountName, 200) by SourceIp;
  union kerberos_failures, logon_failures
  | extend
      AccountName = tolower(tostring(split(RawUser, "@")[0])),
      SourceIp = replace_string(RawIp, "::ffff:", "")
  | where isnotempty(AccountName) and AccountName !endswith "$"
  | where isnotempty(SourceIp) and SourceIp !in ("-", "::1", "127.0.0.1")
  | summarize
      FirstFailure = min(TimeGenerated),
      LastFailure = max(TimeGenerated),
      TargetedAccounts = dcount(AccountName),
      FailedAttempts = count(),
      FailedAccounts = make_set(AccountName, 200)
      by SourceIp
  | where TargetedAccounts >= min_accounts
  | join kind=leftouter successes on SourceIp
  | extend SucceededAfterFailing = coalesce(set_intersect(FailedAccounts, SuccessfulAccounts), dynamic([]))
  | extend SuccessCount = array_length(SucceededAfterFailing)
  | project FirstFailure, LastFailure, SourceIp, TargetedAccounts, FailedAttempts, SuccessCount, SucceededAfterFailing, FailedAccounts
  | order by SuccessCount desc, TargetedAccounts desc
version: 1.0.0
