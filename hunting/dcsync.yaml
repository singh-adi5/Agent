id: e36769f7-9b48-4205-abb5-136d1a8d7e01
name: Hunt - every account using directory replication rights
description: |
  Every account that exercised a directory replication right, domain controllers included. Use it to
  baseline who replicates, to fill the analytics rule allow-lists, and to find accounts that should
  not hold the right.
requiredDataConnectors:
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003.006
query: |
  // Name:        Hunt - every account using directory replication rights
  // Purpose:     List every account that exercised a replication right, domain
  //              controllers included. Gives the baseline needed to fill the analytics
  //              rule's domain controller and approved account lists, and shows any
  //              account that should not be there.
  // Data source: SecurityEvent (Windows Security Events via AMA), EventID 4662 on domain controllers
  // ATT&CK:      T1003.006 (OS Credential Dumping: DCSync)
  // Use:         Run over 30 days. Every row that is not a domain controller computer
  //              account needs an owner and a reason.
  let get_changes = "1131f6aa-9c07-11d1-f79f-00c04fc2dcd2";
  let get_changes_all = "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2";
  let get_changes_filtered = "89e95b76-444d-4c62-991a-0facbeda640c";
  SecurityEvent
  | where EventID == 4662 and ObjectServer == "DS"
  | where Properties has get_changes or Properties has get_changes_all or Properties has get_changes_filtered
  | extend Actor = tolower(SubjectUserName)
  | extend IsMachineAccount = Actor endswith "$"
  | summarize
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated),
      Operations = count(),
      ActiveDays = dcount(bin(TimeGenerated, 1d)),
      UsedGetChangesAll = max(Properties has get_changes_all),
      ReportingDcs = make_set(Computer, 20)
      by Actor, ActorDomain = SubjectDomainName, IsMachineAccount
  | project FirstSeen, LastSeen, Actor, ActorDomain, IsMachineAccount, UsedGetChangesAll, Operations, ActiveDays, ReportingDcs
  | order by IsMachineAccount asc, Operations desc
version: 1.0.0
